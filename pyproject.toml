[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zenit"
version = "1.1.2"
description = "Scaffold your next Python project with one command"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bojan Konjevic", email = "konjevicbojan1@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "jinja2",
    "typer>=0.12",
    "tomlkit",
    "libcst",
    "ruamel-yaml>=0.19.1",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/BojanKonjevic/zenit"
Repository = "https://github.com/BojanKonjevic/zenit"
Issues = "https://github.com/BojanKonjevic/zenit/issues"

[project.scripts]
zenit = "zenit.cli.main:main"
zn = "zenit.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1",
    "ruff>=0.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3",
    "pre-commit>=4.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zenit" = [
    "templates/**/*",
    "templates/**/.*",
    "addons/**/*",
    "addons/**/.*",
    "generate/*",
]

[tool.ruff]
target-version = "py312"
exclude = [
    "src/zenit/addons/**/files",
    "src/zenit/templates/**/files",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
exclude = [
    "src/zenit/templates/.+/files/",
    "src/zenit/addons/.+/files/",
    "src/zenit/templates/[^/]+/template\\.py$",
    "src/zenit/addons/[^/]+/addon\\.py$",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["slow: marks tests as slow (deselect with -m 'not slow')"]



