name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync

      - run: pnpm install --frozen-lockfile

      - run: pnpm run docs:build

      - name: Generate studio page data
        run: uv run python scripts/export-configure-data.py

      - name: Assemble site
        run: |
          mkdir -p _site/docs _site/studio
          cp index.html _site/index.html
          cp studio.html _site/studio/index.html
          cp studio.css studio.js studio-data.json _site/studio/
          cp -r docs/.vitepress/dist/. _site/docs/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
