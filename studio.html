<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zenit studio: build your create command</title>
<link rel="stylesheet" href="./studio.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="../">zenit</a>
    <span class="nav-sub">studio</span>
    <div class="nav-links">
      <a href="../docs/getting-started">docs</a>
      <a href="https://github.com/BojanKonjevic/zenit" target="_blank">github</a>
      <button class="nav-btn" id="shareBtn" type="button">share</button>
    </div>
  </div>
</nav>

<div class="mini-cmd" id="miniCmd" aria-hidden="true">
  <span class="mini-prompt">$</span>
  <span class="mini-text" id="miniText"></span>
  <button class="btn btn-solid mini-copy" id="miniCopy" type="button" tabindex="-1">copy</button>
</div>

<div class="layout">
  <aside class="side">
    <section class="side-block">
      <h2 class="side-title">Template</h2>
      <div id="tplList"></div>
    </section>

    <section class="side-block">
      <h2 class="side-title">Addons <span class="count" id="selCount"></span></h2>
      <div class="chips" id="filterChips"></div>
      <div id="addonList"></div>
    </section>
  </aside>

  <main class="main">
    <div class="cmd-panel" id="cmdPanel">
      <div class="cmd-head">
        <label class="proj-label" for="projInput">Project</label>
        <input class="proj-input" id="projInput" value="my-project" maxlength="60" spellcheck="false" autocomplete="off">
      </div>
      <pre class="cmd" id="cmdText"></pre>
      <div class="cmd-actions">
        <button class="btn btn-solid" id="copyBtn" type="button">copy command</button>
        <button class="btn" id="clearBtn" type="button">clear all</button>
      </div>
      <p class="auto-note" id="autoNote"></p>
    </div>

    <section class="detail">
      <h2 class="detail-title">What gets generated</h2>
      <p class="detail-sub" id="detailSub"></p>
      <div id="detailBody"></div>
    </section>

    <footer class="foot">
      <span id="footMeta"></span>
      <a href="../docs/commands/create">create docs</a>
    </footer>
  </main>
</div>

<script src="./studio.js" defer></script>
</body>
</html>
